name: Build MatchDay APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          assert scripts, 'Missing application script'
          Path('/tmp/matchday.js').write_text(scripts[-1])
          PY
          node --check /tmp/matchday.js
      - name: Prepare assets and web app
        run: |
          python3 -m pip install --user pillow
          python3 generate_assets.py
          mkdir -p www
          cp index.html www/index.html
      - name: Install and sync Capacitor
        run: |
          npm install
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MatchDay-v1.3-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
