<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d12">
<title>MatchDay</title>
<style>
:root{--bg:#f1f7f6;--panel:#ffffff;--ink:#0b1c24;--sub:#5a7580;--line:#d8e6e8;--soft:#e8f3f2;--a1:#16a34a;--a2:#0284c7;--live:#dc2626;--ok:#16a34a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#070d12;--panel:#0f1a22;--ink:#e8f4f1;--sub:#8aa4ad;--line:#1b2c36;--soft:#13222c;--a1:#22c55e;--a2:#0ea5e9;--live:#f87171;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#070d12;--panel:#0f1a22;--ink:#e8f4f1;--sub:#8aa4ad;--line:#1b2c36;--soft:#13222c;--a1:#22c55e;--a2:#0ea5e9;--live:#f87171;--ok:#4ade80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0}
/* splash */
#splash{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 40%,#0c4a3a,#070d12 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .6s,transform .6s}
#splash.hide{opacity:0;transform:scale(1.08);pointer-events:none}
.sl{width:116px;height:116px;filter:drop-shadow(0 14px 40px #22c55e77)}
.sl .bgr{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both;transform-origin:50% 50%}
.sl .bl{transform-box:fill-box;transform-origin:center;animation:roll 1.2s .3s cubic-bezier(.2,1,.3,1) both}
.sn{margin-top:22px;font-size:34px;font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,#86efac,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent;animation:up .7s 1s both}
.st{margin-top:6px;font-size:12px;color:#8aa4ad;letter-spacing:3px;animation:up .7s 1.2s both}
.by{margin-top:14px;font-size:12px;color:#5f7c86;letter-spacing:1px;animation:up .7s 1.4s both}
.sb{margin-top:26px;width:150px;height:4px;border-radius:9px;background:#ffffff1c;overflow:hidden}
.sb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22c55e,#0ea5e9);animation:fill 1.7s .2s forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes roll{from{transform:translateX(-60px) rotate(-360deg) scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fill{to{width:100%}}
/* layout */
.app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.glow{position:absolute;border-radius:50%;filter:blur(80px);opacity:.22;pointer-events:none;animation:float 14s ease-in-out infinite}
.g1{width:260px;height:260px;background:var(--a1);top:-100px;left:-80px}.g2{width:220px;height:220px;background:var(--a2);top:60px;right:-100px;animation-delay:-6s}
@keyframes float{50%{transform:translate(30px,30px) scale(1.15)}}
header{position:relative;z-index:3;display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
header svg.lg{width:36px;height:36px;flex:none}
header b{font-size:20px;font-weight:800;letter-spacing:.3px;flex:1;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{width:40px;height:40px;border-radius:13px;background:var(--panel);border:1px solid var(--line);font-size:17px;transition:transform .15s}.ib:active{transform:scale(.88)}
.ib.spin{animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.tabs{position:relative;z-index:3;display:flex;margin:6px 14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:4px}
.tabs button{flex:1;background:transparent;padding:10px 0;border-radius:12px;font-weight:700;color:var(--sub);position:relative;z-index:1;transition:color .25s}
.tabs button.on{color:#fff}
.pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:12px;background:linear-gradient(135deg,var(--a1),var(--a2));transition:transform .35s cubic-bezier(.3,1.2,.4,1);box-shadow:0 6px 18px #16a34a44}
.chips{position:relative;z-index:3;display:flex;gap:8px;overflow-x:auto;padding:4px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:8px 14px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--sub);font-weight:600;font-size:13.5px;transition:all .25s}
.chips button.on{background:var(--ink);color:var(--bg);border-color:transparent}
.chips button.lv.on{background:var(--live);color:#fff}
#view{flex:1;min-height:0;overflow-y:auto;position:relative;z-index:1;padding:4px 14px 30px;-webkit-overflow-scrolling:touch}
.grp{margin:14px 2px 6px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--sub);font-weight:700}
.mc{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:13px 14px;margin:8px 0;animation:vin .4s both;transition:transform .15s;position:relative;overflow:hidden}
.mc:active{transform:scale(.985)}
.mc.live{border-color:#ef444466;box-shadow:0 0 0 0 #ef444455;animation:vin .4s both,lp 2.4s ease-in-out infinite}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes lp{50%{box-shadow:0 0 0 5px #ef444418}}
.mt{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.mt .lgn{font-size:12px;color:var(--sub);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp{font-size:12px;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--soft);color:var(--sub);white-space:nowrap}
.cp.live{background:#ef444422;color:var(--live)}.cp.live:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:6px;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.25}}
.tm{display:flex;align-items:center;gap:10px;padding:5px 0}
.tl{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--sub);flex:none;overflow:hidden}
.tl img{width:100%;height:100%;object-fit:contain}
.tn{flex:1;min-width:0;font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn.w{font-weight:800}
.sc{font-size:20px;font-weight:800;min-width:24px;text-align:right}.sc.cr{font-size:15px;white-space:nowrap}
.ms{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px;color:var(--sub);line-height:1.4}
.empty{text-align:center;color:var(--sub);padding:34px 14px;line-height:1.55}.empty b{font-size:38px;display:block;margin-bottom:6px}
.foot{text-align:center;font-size:12px;color:var(--sub);padding:14px 0 4px;line-height:1.6}
.banner{background:#f59e0b22;color:#d97706;border:1px solid #f59e0b55;border-radius:14px;padding:10px 12px;font-size:13px;margin:8px 0;line-height:1.45}
.sk{height:96px;border-radius:18px;background:linear-gradient(90deg,var(--panel),var(--soft),var(--panel));background-size:200% 100%;margin:8px 0;animation:sh 1.4s infinite;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}
/* sheet */
#sw{position:fixed;inset:0;z-index:60;background:#0009;display:none;align-items:flex-end;justify-content:center}
#sw.on{display:flex;animation:fi .25s}@keyframes fi{from{opacity:0}}
#sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--panel);border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:su .35s cubic-bezier(.2,1,.3,1)}
@keyframes su{from{transform:translateY(100%)}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
#sheet h2{margin:4px 0 6px;font-size:20px}
.btn{padding:13px 16px;border-radius:14px;background:var(--soft);color:var(--ink);font-weight:700;transition:transform .15s}.btn:active{transform:scale(.95)}
.btn.pri{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
a.btn{text-decoration:none;display:inline-block;text-align:center}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.btns .btn{flex:1;min-width:120px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}.row:last-child{border-bottom:0}
.row small{display:block;color:var(--sub);font-size:12px}
.big{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 0;min-width:0}.big .tl{width:42px;height:42px;font-size:14px}.big .tn{font-size:clamp(14px,4vw,18px);min-width:0;overflow-wrap:anywhere;line-height:1.2}.big .sc{font-size:clamp(20px,6vw,29px);white-space:nowrap;font-variant-numeric:tabular-nums;max-width:100%}
#sheet{width:100%;max-width:560px;max-height:calc(100dvh - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;min-height:0;padding-left:16px;padding-right:16px}
#sw{align-items:flex-end}
#sheet h2{font-size:22px}
.score-unavailable{display:flex;gap:12px;align-items:flex-start;padding:16px 14px;margin:14px 0;border:1px solid var(--line);background:var(--soft);border-radius:16px;color:var(--ink)}
.score-unavailable .su-icon{font-size:24px}
.score-unavailable p{margin:5px 0 0;color:var(--sub);font-size:13px;line-height:1.5}
.abt{position:relative;overflow:hidden;background:linear-gradient(145deg,var(--panel),var(--soft));border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0}
.abt:before{content:"";display:block;height:4px;position:absolute;top:0;left:0;right:0;background:linear-gradient(90deg,var(--a1),var(--a2))}
.abt .anm{font-size:22px;font-weight:850;letter-spacing:-.4px}
.abt .arl{font-size:13px;color:var(--sub);margin-top:4px;padding-bottom:14px}
.abt .ar{display:grid;grid-template-columns:minmax(78px, .7fr) minmax(0,1.3fr);align-items:start;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.abt .ar span{color:var(--sub);flex:none}.abt .ar b{font-weight:650;text-align:right;overflow-wrap:anywhere;min-width:0}
.abt .aft{margin-top:14px;font-size:12px;color:var(--sub);text-align:center;line-height:1.6}
@media(max-width:380px){#sheet{padding-left:13px;padding-right:13px}.big{grid-template-columns:36px minmax(0,1fr) auto;gap:8px}.big .tl{width:36px;height:36px}.big .sc{font-size:20px}.abt{padding:15px}.btns .btn{min-width:0}}

.ev{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}.ev:last-child{border-bottom:0}.ev .m{width:44px;color:var(--sub);font-weight:700}
.ck{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}.ck:last-child{border-bottom:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--a1);flex:none}
input.f{width:100%;margin-top:6px;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:0;font-size:15px}
label{display:block;font-size:12.5px;color:var(--sub);font-weight:600;margin:12px 0 0}
.note{font-size:12.5px;color:var(--sub);line-height:1.5;margin-top:8px}
.lk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border-radius:14px;background:var(--soft);margin-top:8px;text-decoration:none;color:var(--ink);font-weight:700}
.lk small{display:block;font-weight:500;color:var(--sub);font-size:12.5px;margin-top:2px}
.mono{font:12px ui-monospace,Menlo,monospace;word-break:break-all;color:var(--sub)}
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#13303a;color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.3,1.3,.4,1);z-index:90;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.abt{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin:6px 0}
.abt .anm{font-size:19px;font-weight:700}.abt .arl{font-size:13px;color:var(--sub);margin-top:2px;padding-bottom:10px}
.abt .ar{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.abt .ar span{color:var(--sub);flex:none}.abt .ar b{font-weight:600;text-align:right;word-break:break-word}
.abt .aft{margin-top:14px;font-size:12px;color:var(--sub);text-align:center;line-height:1.6}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--a1);outline-offset:3px}button{touch-action:manipulation}@media (prefers-reduced-motion: reduce){*{animation-duration:.01s !important;animation-delay:0s !important;transition-duration:.01s !important}}

/* MatchDay 1.3: search, compact cards, adaptive touch targets */
.searchbar{margin:10px 0 12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:0 8px 24px #0000000a}
.searchbar label{margin:0 0 5px;display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.searchbar input{width:100%;background:transparent;border:0;outline:none;color:var(--ink);font-size:16px;padding:5px 0}
.searchbar:focus-within{border-color:var(--a1)}
.mc.dense{padding:9px 12px;margin-bottom:6px}.mc.dense .tm{padding:3px 0}.mc.dense .tl{width:26px;height:26px}.mc.dense .mt{margin-bottom:3px}
:root[data-theme=light]{--bg:#f2f6f8;--panel:#fff;--ink:#172832;--sub:#566b76;--line:#dce6eb;--soft:#eaf2f5;--a1:#168b47;--a2:#067aab;--live:#c73535;--ok:#147d3e}
@media(min-width:760px){.app{max-width:800px;margin:auto}.glow{opacity:.1}#sheet{max-width:700px}}
</style>
</head>
<body>

<div id="splash">
  <svg class="sl" viewBox="0 0 100 100" fill="none">
    <defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs>
    <rect class="bgr" width="100" height="100" rx="24" fill="url(#mg)"/>
    <g class="bl"><circle cx="50" cy="50" r="30" fill="#fff"/><path d="M50 37 L61 45 L57 58 L43 58 L39 45 Z" fill="#0b3c4f"/><g stroke="#0b3c4f" stroke-width="3" stroke-linecap="round"><path d="M50 37 L50 24"/><path d="M61 45 L73 41"/><path d="M57 58 L65 68"/><path d="M43 58 L35 68"/><path d="M39 45 L27 41"/></g></g>
  </svg>
  <div class="sn">MatchDay</div>
  <div class="st">LIVE · FOOTBALL · CRICKET</div>
  <div class="by">by Roohu</div>
  <div class="sb"><i></i></div>
</div>

<div class="app">
  <div class="glow g1"></div><div class="glow g2"></div>
  <header>
    <svg class="lg" viewBox="0 0 100 100" fill="none"><rect width="100" height="100" rx="24" fill="url(#mg)"/><circle cx="50" cy="50" r="30" fill="#fff"/><path d="M50 37 L61 45 L57 58 L43 58 L39 45 Z" fill="#0b3c4f"/><g stroke="#0b3c4f" stroke-width="3" stroke-linecap="round"><path d="M50 37 L50 24"/><path d="M61 45 L73 41"/><path d="M57 58 L65 68"/><path d="M43 58 L35 68"/><path d="M39 45 L27 41"/></g></svg>
    <b>MatchDay</b>
    <button class="ib" id="rf" data-act="refresh" aria-label="Refresh">↻</button>
    <button class="ib" data-act="watch" aria-label="Where to watch">📺</button>
    <button class="ib" data-act="menu" aria-label="Settings">⚙️</button>
  </header>
  <div class="tabs"><i class="pill" id="pill"></i><button data-act="sport" data-v="football">⚽ Football</button><button data-act="sport" data-v="cricket">🏏 Cricket</button></div>
  <div class="chips" id="c1"></div>
  <div class="chips" id="c2"></div>
  <div id="view"></div>
</div>
<div id="sw"><div id="sheet"></div></div>
<div id="toast"></div>

<script>
var KEY='matchday_v1',DAY=864e5;
var LEAGUES=[['eng.1','Premier League'],['esp.1','La Liga'],['ita.1','Serie A'],['ger.1','Bundesliga'],['fra.1','Ligue 1'],['uefa.champions','Champions League'],['uefa.europa','Europa League'],['usa.1','MLS'],['ned.1','Eredivisie'],['por.1','Liga Portugal'],['tur.1','Super Lig'],['sau.1','Saudi Pro League'],['fifa.friendly','International friendlies'],['uefa.nations','Nations League'],['fifa.world','World Cup'],['conmebol.libertadores','Copa Libertadores']];
var P={query:'',dense:false,theme:'dark',sport:'football',day:0,status:'all',fav:false,source:'auto',leagues:['eng.1','esp.1','ita.1','ger.1','fra.1','uefa.champions'],favs:[],cseries:[]};
var SOFA='https://api.sofascore.com/api/v1';
var SOFA_IDS={'eng.1':17,'esp.1':8,'ita.1':23,'ger.1':35,'fra.1':34,'uefa.champions':7,'uefa.europa':679,'usa.1':242,'ned.1':37,'por.1':238,'tur.1':52,'sau.1':955,'conmebol.libertadores':384,'fifa.world':16};
var RAW='';
var DATA={football:{list:[],t:0,err:'',loading:false,demo:false},cricket:{list:[],t:0,err:'',loading:false,demo:false}};
var LOG=[],NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function sod(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())}
function tm(t){var d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){if(d.sport)P.sport=d.sport;if(typeof d.dense==='boolean')P.dense=d.dense;if(['dark','light'].includes(d.theme))P.theme=d.theme;if(Array.isArray(d.leagues)&&d.leagues.length)P.leagues=d.leagues;if(Array.isArray(d.favs))P.favs=d.favs;if(Array.isArray(d.cseries))P.cseries=d.cseries;if(d.source==='espn'||d.source==='sofa'||d.source==='auto')P.source=d.source;if(['all','live','pre','post'].indexOf(d.status)>-1)P.status=d.status;if(d.day===-1||d.day===0||d.day===1)P.day=d.day;if(typeof d.fav==='boolean')P.fav=d.fav}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({sport:P.sport,dense:P.dense,theme:P.theme,leagues:P.leagues,favs:P.favs,cseries:P.cseries,source:P.source,status:P.status,day:P.day,fav:P.fav}))}catch(e){}}
/* Phase 1: timestamped local snapshot. Cached scores are never labeled live. */
var CACHE_KEY='matchday_cache_v2';
function restoreCache(){try{var c=JSON.parse(localStorage.getItem(CACHE_KEY)||'{}');['football','cricket'].forEach(function(sp){var x=c[sp];if(x&&Array.isArray(x.list)&&Number.isFinite(x.t)&&x.t<=Date.now()&&Date.now()-x.t<7*DAY){DATA[sp].list=x.list.slice(0,350);DATA[sp].t=x.t;DATA[sp].cached=true}})}catch(e){}}
function storeCache(){try{var c={};['football','cricket'].forEach(function(sp){if(DATA[sp].list.length&&!DATA[sp].demo)c[sp]={list:DATA[sp].list.slice(0,350),t:DATA[sp].t}});localStorage.setItem(CACHE_KEY,JSON.stringify(c))}catch(e){}}
var tt;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},2200)}
function copyText(t){var ok=false;try{if(navigator.clipboard){navigator.clipboard.writeText(t);ok=true}}catch(e){}if(!ok){try{var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();ok=document.execCommand('copy');document.body.removeChild(ta)}catch(e){}}return ok}

/* ---------- data: fetch ---------- */
function getJson(url,name){
  return new Promise(function(res,rej){
    var done=false,t=setTimeout(function(){if(!done){done=true;LOG.push({name:name,url:url,status:'timeout',n:0});rej(new Error('timeout'))}},12000);
    fetch(url).then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status);

function parseSofaIncidents(j,e){

    var t=i.incidentType,min=(i.time!=null?i.time:'')+(i.addedTime?'+'+i.addedTime:'')+"'",tm=e.teams[i.isHome?0:1]||{};

function parseEspnKeyEvents(j){

/* cricket: look for batters and bowlers inside unknown JSON */
function statMap(o){
  var m={};
  Object.keys(o).forEach(function(k){var v=o[k];if(typeof v==='number'||(typeof v==='string'&&v!==''&&v.length<14))m[k.toLowerCase()]=v});
  ['stats','statistics'].forEach(function(k){
    var a=o[k];
    if(Array.isArray(a))a.forEach(function(s){if(s&&typeof s==='object'){var n=String(s.name||s.abbreviation||s.shortDisplayName||s.label||'').toLowerCase(),v=s.value!=null?s.value:s.displayValue;if(n&&v!=null)m[n]=v}});
    else if(a&&typeof a==='object')Object.keys(a).forEach(function(kk){var v=a[kk];if(typeof v==='number'||typeof v==='string')m[kk.toLowerCase()]=v});
  });
  return m;
}
function nameOf(o){return(o.athlete&&(o.athlete.displayName||o.athlete.name))||(o.player&&(o.player.name||o.player.displayName||o.player.shortName))||o.displayName||o.fullName||(typeof o.name==='string'?o.name:'')||''}
function pick(m,keys){for(var i=0;i<keys.length;i++)if(m[keys[i]]!=null&&m[keys[i]]!=='')return m[keys[i]];return null}
function scanCricket(root){
  var bats=[],bowls=[],order=0;
  (function walk(o,d){
    if(!o||typeof o!=='object'||d>10)return;
    if(Array.isArray(o)){o.forEach(function(x){walk(x,d+1)});return}
    var nm=nameOf(o);
    if(nm){
      var m=statMap(o),runs=pick(m,['runs','runsscored','r']),balls=pick(m,['balls','ballsfaced','bf','b']),ov=pick(m,['overs','oversbowled','o']),wk=pick(m,['wickets','wkts','w']),conc=pick(m,['conceded','runsconceded','runs','r']);

  if(!D.loading&&Date.now()-D.t>(live?(P.source==='espn'?20000:10000):90000)&&!D.demo)refresh(false);
},5000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&Date.now()-DATA[P.sport].t>20000)refresh(false)});

load();document.documentElement.dataset.theme=P.theme;restoreCache();render();refresh(false);
